paths:
  root: "{root}"
  raw_dir: "{root}/data_raw"                  # Eingangsdaten
  clean_dir: "{root}/data_clean"              # Output: events.csv / event_actor.csv
  edges: "{root}/data_derived/edges_person.csv"
  edges_prepared: "{root}/data_derived/edges_person_prepared.csv"
  levels: "{root}/data_derived/infomap_levels.csv"
  levels_csv: "{root}/data_derived/infomap_levels.csv"  # alias für Kompatibilität
  persons: "{root}/data_derived/persons.csv"
  events_master: "{root}/data/clean/events_master.csv"

ingest:
  input_subdir: "sample"              # relativ zu paths.raw_dir
  progress_every: 500
  keep_body_text: false
  body_text_max_chars: 5000

filters:
  internal:
    mode: "outside_supernode"         # include | outside_supernode | exclude
    domains: ["@enron.com"]
    outside_label: "Outside world"
    allow_external_leaders: false
  edges:
    min_weight: 1
    require_reciprocal: false
  subgraph:
    seed_emails: []                   # z.B. ["ceo@enron.com"]
    hops: 0

selection:
  mode: "coverage"
  coverage:
    L1: 0.80
    L2: 0.80
    L3: 0.70

thresholds:
  min_size_fallback:
    L1: 5
    L2: 5
    L3: 5
  pct_exec: 99.9
  pct_l1: 99.0
  pct_l2: 99.0
  pct_l3: 98.0
  z_min_l3_for_plot: 0.0
  n_execs: 8

runtime:
  random_seed: 42
  bt_sample_cap: 2000

outputs:
  cutoffs_dir: "{root}/reports/cutoffs"
  signif_dir: "{root}/reports/significance"
  org_dir: "{root}/reports/orgchart"
  org_dir_viz: "{root}/reports/orgchart/viz"
  org_dir_viz_pies: "{root}/reports/orgchart/viz/pies"
  topics_dir: "{root}/reports/topics"
  diagnostics_dir: "{root}/reports/diagnostics"
  topics_dir_reduced: "{root}/reports/topics/reduced"

  # 👉 Erweiterte Unterverzeichnisse laut Audit
  org_dir_viz: "{root}/reports/orgchart/viz"
  org_dir_viz_pies: "{root}/reports/orgchart/viz/pies"
  topics_dir_reduced: "{root}/reports/topics/reduced"

reports:
  orgchart:
    path: "{root}/reports/orgchart"
    cutoffs: "{root}/reports/orgchart/cutoffs"
    viz: "{root}/reports/orgchart/viz"
    pies: "{root}/reports/orgchart/viz/pies"

schemas:
  events_master: config/schema/events_master.yaml
