# ============================================================
# Leak-Project Schema Definition: events_master
# Version: 0.2 (consolidate/ingest-core)
# ============================================================

schema_name: events_master
version: "0.2"
description: >
  Zentrales Kommunikationsschema des Leak-Project.
  Enthält geprüfte, typisierte E-Mail-Events für Themen-, Netzwerk-
  und Hierarchieanalysen. Alle Spalten auditierbar und reproduzierbar.

fields:
  # --- Basis-IDs ---
  event_id:
    type: str
    description: Eindeutige ID für jede Mail (z. B. MD5 über Textinhalt)
  thread_id:
    type: str
    description: Thread-/Konversations-ID

  # --- Zeit ---
  timestamp:
    type: datetime
    description: UTC-Zeitpunkt der Mail
  date_local:
    type: date
    description: Lokales Datum (optional, Zeitzone abhängig)

  # --- Kommunikation ---
  sender:
    type: str
    description: Absenderadresse
  recipients_to:
    type: str
    description: Hauptempfänger (Komma-separiert)
  recipients_cc:
    type: str
    description: CC-Empfänger
  n_recipients_total:
    type: int
    description: Gesamtzahl der Empfänger

  # --- Inhalt ---
  subject:
    type: str
    description: Betreff der Mail
  body_text:
    type: str
    description: Volltext der Mail (bereinigt)
  text_length:
    type: int
    description: Zeichenlänge des Texts

  # --- Topics (später berechnet) ---
  topics:
    type: json
    description: Topic-Wahrscheinlichkeiten (JSON-String)
  dominant_topic:
    type: int
    description: Wichtigstes Topic
  topic_labels:
    type: str
    description: Kommagetrennte Topic-Labels

  # --- Organisation (später) ---
  cluster_id:
    type: int
    description: Zuordnung zu Cluster-ID (aus Hierarchie)
  cluster_level:
    type: str
    description: Hierarchieebene
  leader:
    type: str
    description: Cluster-Leader

  # --- Netzwerk (optional) ---
  in_degree:
    type: int
    description: Eingehende Verbindungen
  out_degree:
    type: int
    description: Ausgehende Verbindungen
  centrality_zscore:
    type: float
    description: Zentralität (z-Score)

  # --- Technisch / Meta ---
  source_file:
    type: str
    description: Ursprungsdatei innerhalb von data_raw
  parse_status:
    type: str
    description: ok | failed | partial
  ingest_timestamp:
    type: datetime
    description: Zeitpunkt der Verarbeitung

  # --- Klassifikation (NEU) ---
  content_type:
    type: str
    allowed: [normal, thread_history, newsletter, empty_or_stub, attachment_dump]
    description: Typ der Mail (automatisch erkannt)
  include_in_analysis:
    type: bool
    description: True = für Analyse zulässig

required:
  - event_id
  - sender
  - subject
  - body_text
  - parse_status
  - ingest_timestamp