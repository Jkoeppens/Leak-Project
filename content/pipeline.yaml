modules:

  - name: pipe/config.py
    purpose: >
      Lädt YAML-Konfigurationen, merged lokale Overrides und wandelt Pfade in absolute um.
      Grundlage für alle nachfolgenden Module.
    io:
      input: []
      use:
        - name: yaml
          type: library
          desc: Lädt Konfigurationsdateien
        - name: pathlib
          type: library
          desc: Pfad-Operationen und Pfadprüfung
      output:
        - name: cfg_dict
          type: dict
          desc: Vollständiges Konfigurationsobjekt mit absoluten Pfaden

  - name: pipe/ingest/ingest_any.py
    purpose: >
      Liest E-Mail-Daten (.eml, .mbox, Verzeichnisse) ein und wandelt sie
      in tabellarische CSV-Dateien für Ereignisse, Akteure und Kommunikationskanten um.
    io:
      input:
        - name: raw_dir
          type: directory
          source: cfg.paths.raw_dir
          desc: Verzeichnis mit Roh-E-Mails
      use:
        - name: pipe.config.load_config
          type: function
          desc: Lädt und erweitert Konfiguration
      output:
        - name: events.csv
          type: csv
          target: clean_dir
          desc: Metadaten jeder Mail
        - name: event_actor.csv
          type: csv
          target: clean_dir
          desc: Zuordnung Event ↔ Akteur ↔ Rolle
        - name: edges.csv
          type: csv
          target: clean_dir
          desc: Aggregierte Kommunikationskanten

  - name: pipe/hierarchy/diagnose_levels.py
    purpose: >
      Analysiert Clustergrößen über Hierarchie-Level, prüft Power-Law-Verteilungen
      und bestimmt Heuristiken wie Top-k-Abdeckung und Elbow-Punkte.
    io:
      input:
        - name: hierarchy_df
          type: csv
          source: cfg.paths.levels
          desc: Hierarchieebenen mit Spalten level_1, level_2, ...
      use:
        - name: powerlaw
          type: library
          desc: Statistische Fits
      output:
        - name: cluster_stats_summary.csv
          type: csv
          target: outputs.cutoffs_dir
          desc: Kennzahlen pro Level
        - name: ccdf_<level>.png
          type: image
          target: outputs.cutoffs_dir
          desc: Verteilungsplots pro Level

  - name: pipe/hierarchy/io.py
    purpose: >
      Robustes Laden, Filtern und Berichten von Edgelisten und Level-Dateien.
      Grundlage für alle nachfolgenden Hierarchie-Analysen.
    io:
      input:
        - name: edges.csv
          type: csv
          source: cfg.paths.edges
          desc: Roh-Edgelist (Kommunikationskanten)
        - name: levels.csv
          type: csv
          source: cfg.paths.levels
          desc: Hierarchiedaten mit Clusterzuordnung
      output:
        - name: data_report.json
          type: json
          target: outputs.cutoffs_dir
          desc: Basisstatistik zum Netzwerk
        - name: top_degree_nodes.csv
          type: csv
          target: outputs.cutoffs_dir
          desc: Liste der zentralsten Knoten
        - name: weight_histogram.png
          type: image
          target: outputs.cutoffs_dir
          desc: Histogramm der Kantengewichte

  - name: pipe/hierarchy/leader_select.py
    purpose: >
      Wählt Cluster-Leader anhand von Knotendegree und identifiziert globale Executives.
      Degree-basierte Schnellmethode zur Führungsbestimmung.
    io:
      input:
        - name: edges_prepared
          type: csv
          source: cfg.paths.edges_prepared
          desc: Gefilterte und normalisierte Edgelist
        - name: levels.csv
          type: csv
          source: cfg.paths.levels
          desc: Hierarchiedaten mit Clustern
        - name: selection_dynamic.json
          type: json
          source: outputs.org_dir
          desc: Sichtbarkeitsauswahl aktiver Cluster
      output:
        - name: leaders.json
          type: json
          target: outputs.org_dir
          desc: Strukturierte Leaderdaten
        - name: leaders_flat.csv
          type: csv
          target: outputs.org_dir
          desc: Flache Tabelle aller Leader und Execs

  - name: pipe/hierarchy/leaders.py
    purpose: >
      Bestimmt Leader und globale Executives auf Basis der Betweenness-Zentralität.
      Präzisere Alternative zu leader_select.py.
    io:
      input:
        - name: edges_prepared
          type: csv
          source: cfg.paths.edges_prepared
          desc: Netzwerk mit Kantengewichten
        - name: levels.csv
          type: csv
          source: cfg.paths.levels
          desc: Hierarchiedaten
        - name: selection.json
          type: json
          source: outputs.org_dir
          desc: Cluster-Auswahl
      output:
        - name: leaders.json
          type: json
          target: outputs.org_dir
          desc: Strukturierte Leaderdaten mit Scores
        - name: leaders_flat.csv
          type: csv
          target: outputs.org_dir
          desc: Flache Tabelle aller Cluster-Leader und Execs

  - name: pipe/hierarchy/orgchart_html_topics.py
    purpose: >
      Rendert ein interaktives Organigramm mit Pyvis aus Hierarchie-, Leader- und Topic-Daten.
    io:
      input:
        - name: selection
          type: json
          source: outputs.org_dir
          desc: Hierarchische Strukturdefinition
        - name: leaders.json
          type: json
          source: outputs.org_dir
          desc: Leader-Daten
        - name: topics_by_level
          type: dict
          source: optional
          desc: Themenverteilungen pro Ebene
      output:
        - name: organigram_interaktiv.html
          type: html
          target: outputs.org_dir
          desc: Interaktive Netzwerkvisualisierung

  - name: pipe/hierarchy/prep.py
    purpose: >
      Bereitet Edgelisten für alle weiteren Analysen vor, filtert, normalisiert und erstellt Reports.
    io:
      input:
        - name: edges.csv
          type: csv
          source: cfg.paths.edges
          desc: Ursprüngliche Edgelist
      use:
        - name: io.py
          type: module
          desc: Edge- und Filterfunktionen
      output:
        - name: edges_prepared.csv
          type: csv
          target: cfg.paths.edges_prepared
          desc: Bereinigte, gefilterte Edgelist
        - name: data_report.json
          type: json
          target: outputs.cutoffs_dir
          desc: Basisstatistik
        - name: hist_weights_prepared.png
          type: image
          target: outputs.cutoffs_dir
          desc: Gewichtshistogramm

  - name: pipe/hierarchy/signif_debug.py
    purpose: >
      Diagnostiziert Signifikanzwerte, erkennt Ausreißer und erstellt Debug-Reports.
    io:
      input:
        - name: cluster_significance_<level>.csv
          type: csv
          source: outputs.signif_dir
          desc: Signifikanzdaten je Hierarchieebene
      output:
        - name: z_debug_summary.csv
          type: csv
          target: outputs.signif_dir
          desc: Gesamtstatistik aller Levels
        - name: z_debug_outliers.csv
          type: csv
          target: outputs.signif_dir
          desc: Extrem-Cluster pro Level

  - name: pipe/signif.py
    purpose: >
      Berechnet robuste Z-Scores pro Cluster/Level auf Basis des Chung–Lu-Modells.
      Statistischer Kern der Hierarchieanalyse.
    io:
      input:
        - name: levels.csv
          type: csv
          source: cfg.paths.levels
          desc: Hierarchiedaten
        - name: edges_prepared.csv
          type: csv
          source: cfg.paths.edges_prepared
          desc: Bereinigte Edgelist
      use:
        - name: io.load_levels
          type: function
          desc: Robust geladenes Level-DataFrame
        - name: cluster_stats_summary.csv
          type: csv
          source: outputs.cutoffs_dir
          desc: Voranalyse für Mindestgröße
      output:
        - name: cluster_significance_<level>.csv
          type: csv
          target: outputs.signif_dir
          desc: Z-Scores pro Level
        - name: top10_per_level.csv
          type: csv
          target: outputs.signif_dir
          desc: Schnellüberblick über signifikante Cluster

  - name: pipe/analyze_topics.py
    purpose: >
      Analysiert BERTopic-Ergebnisse und erzeugt textuelle Berichte über Topics,
      häufige Wörter und Beispieldokumente.
    io:
      input:
        - name: topic_info.csv
          type: csv
          source: outputs.topics_dir
          desc: Topic-Metadaten
        - name: topic_words.csv
          type: csv
          source: outputs.topics_dir
          desc: Häufigste Wörter pro Topic
        - name: events_with_topics.csv
          type: csv
          source: outputs.topics_dir
          desc: Mails mit zugeordneten Topics
      use:
        - name: pipe.topics_flow.setup_env
          type: module
          desc: Initialisiert Environment
      output: []

  - name: pipe/topics_flow/attach_topics_to_hierarchy.py
    purpose: >
      Verknüpft Topics mit Hierarchie-Clustern basierend auf der Infomap-Levelstruktur.
      Unterstützt zeitliche Aggregation (periodisch oder „rolling“).
    io:
      input:
        - name: cluster_topic_pies_summary.csv
          type: csv
          source: outputs.org_dir
          desc: Aggregierte Topic-Verteilungen pro Cluster
        - name: cluster_topic_pies_summary_YYYY-MM.csv
          type: csv
          source: outputs.org_dir
          desc: Periodische Aggregation bei Zeitmodus
        - name: infomap_levels.csv
          type: csv
          source: paths.levels_csv
          desc: Hierarchieebenen der Organisation
      use:
        - name: pandas
          type: library
          desc: Datenimport, Merge, Aggregation
      output:
        - name: topic_distribution_by_level.csv
          type: csv
          target: outputs.org_dir
          desc: Verteilung der Topics nach Hierarchieebene
        - name: topic_distribution_by_level_YYYY-MM.csv
          type: csv
          target: outputs.org_dir
          desc: Zeitabhängige Verteilungen nach Hierarchieebene

  - name: pipe/clean_threads.py
    purpose: >
      Bereinigt Event-Texte (z. B. E-Mails), erkennt Threads und filtert Mails nach Länge.
      Liefert saubere Textgrundlage für Topic-Modellierung.
    io:
      input:
        - name: events_patched_with_participants.csv
          type: csv
          source: paths.clean_dir
          desc: E-Mail-Events mit Teilnehmerinformationen
      use:
        - name: pandas
          type: library
        - name: re
          type: library
          desc: Regex-Textbereinigung
      output:
        - name: events_clean.csv
          type: csv
          target: paths.clean_dir
          desc: Bereinigte Events mit Threads und Textflags
        - name: events_roots_for_topics.csv
          type: csv
          target: paths.clean_dir
          desc: Thread-Root-Mails für Topic-Modellierung

  - name: pipe/topics_flow/cluster_topic_pies.py
    purpose: >
      Erzeugt Topic-Verteilungen pro organisationalem Cluster basierend auf der Hierarchie.
      Unterstützt periodische und rollende Zeitaggregation.
    io:
      input:
        - name: events_with_topics.csv
          type: csv
          source: outputs.topics_dir
          desc: Ereignisse mit zugeordneten Topics
        - name: infomap_levels.csv
          type: csv
          source: paths.levels_csv
          desc: Hierarchieebenen der Organisation
      use:
        - name: pandas
          type: library
        - name: numpy
          type: library
        - name: pipe.topics_flow.utils.export_cluster_pies
          type: function
          desc: Optionaler grafischer Pie-Export
      output:
        - name: cluster_topic_pies.csv
          type: csv
          target: outputs.org_dir
          desc: Topic-Verteilungen pro Cluster
        - name: cluster_topic_pies_summary.csv
          type: csv
          target: outputs.org_dir
          desc: Aggregierte Zusammenfassung der Topic-Verteilungen
        - name: viz/pies/
          type: directory
          target: outputs.org_dir
          desc: Optionaler Ordner mit grafischen Mini-Pies

  - name: pipe/diagnose_cluster_pies.py
    purpose: >
      Explorative Analyse der Topic-Verteilungen pro Cluster.
      Erstellt Heatmaps, Histogramme und Heuristik-Warnungen.
    io:
      input:
        - name: cluster_topic_pies.csv
          type: csv
          source: outputs.org_dir
          desc: Topic-Verteilungen pro Cluster
        - name: cluster_topic_pies_summary.csv
          type: csv
          source: outputs.org_dir
          desc: Optional Top-Topic-Zusammenfassung
      use:
        - name: pandas
          type: library
        - name: numpy
          type: library
        - name: matplotlib.pyplot
          type: library
      output:
        - name: heatmap_cluster_topics.png
          type: image
          target: outputs.org_dir
          desc: Heatmap der Top-Topics pro Cluster
        - name: histogram_cluster_weights.png
          type: image
          target: outputs.org_dir
          desc: Verteilung der Gesamtgewichte pro Cluster
        - name: console_report
          type: text
          desc: Heuristik-Warnungen und Statistiken in Konsole

  - name: pipe/diagnose_flows.py
    purpose: >
      Prüft Konsistenz und Plausibilität der erzeugten Topic-Flussdaten.
      Gibt Statistiken und Artefaktwarnungen in der Konsole aus.
    io:
      input:
        - name: topic_flow_edges_by_level.csv
          type: csv
          source: outputs.org_dir
        - name: topic_flow_edges_total.csv
          type: csv
          source: outputs.org_dir
        - name: topic_distribution_by_sender_level.csv
          type: csv
          source: outputs.org_dir
        - name: topic_distribution_by_recipient_level.csv
          type: csv
          source: outputs.org_dir
        - name: events_with_thread_topics.csv
          type: csv
          source: outputs.org_dir
      use:
        - name: pandas
          type: library
        - name: pathlib
          type: library
      output:
        - name: console_report
          type: text
          desc: Statistiken, Flussübersichten und Artefaktprüfungen

  - name: pipe/diagnose_topic_flows.py
    purpose: >
      Analysiert Kommunikationsflüsse zwischen Clustern auf Topic-Ebene.
      Filtert, zählt und visualisiert Top-Kanten und Top-Themen.
    io:
      input:
        - name: topic_flows.csv
          type: csv
          source: outputs.org_dir
          desc: Rohdaten der Topic-Flüsse zwischen Clustern
      use:
        - name: pandas
          type: library
        - name: numpy
          type: library
        - name: matplotlib.pyplot
          type: library
      output:
        - name: topic_flows_filtered.csv
          type: csv
          target: outputs.org_dir
          desc: Gefilterte Topic-Flüsse nach Mindestgewicht und Events
        - name: console_report
          type: text
          desc: Statistiken und Top-Kantenberichte

  - name: pipe/topics_flow/export_network_viz.py
    purpose: >
      Erzeugt eine interaktive hierarchische Netzwerkvisualisierung der organisationalen Topic-Struktur.
      Knoten = Cluster, Kanten = thematische Flüsse.
    io:
      input:
        - name: nodes_topics.csv
          type: csv
          source: outputs.org_dir/viz
          desc: Knotendaten der Topic-Netzwerkstruktur
        - name: edges_topics.csv
          type: csv
          source: outputs.org_dir/viz
          desc: Kantendaten zwischen Clustern
        - name: cluster_labels.csv
          type: csv
          source: outputs.org_dir/viz
          desc: Optional: Mapping von Cluster-IDs zu Labels
        - name: cluster_pies_index.csv
          type: csv
          source: outputs.org_dir/viz/pies
          desc: Optional: Mini-Pie-Images pro Cluster
      use:
        - name: pyvis.network.Network
          type: library
          desc: Interaktive HTML-Netzwerke
        - name: pandas
          type: library
        - name: json
          type: library
      output:
        - name: org_topics_hier.html
          type: html
          target: outputs.org_dir/viz
          desc: Interaktive hierarchische Netzwerkvisualisierung
        - name: console_report
          type: text
          desc: Knoten- und Kantenzahl, Warnungen, Laufzeitberichte

  - name: pipe/inspect_metatopics.py
    purpose: >
      Überprüft und veranschaulicht die Ergebnisse einer Meta-Topic-Reduktion.
      Zeigt Verteilungen, Subtopic-Zuordnungen und Beispieltexte pro MetaTopic.
    io:
      input:
        - name: events_with_metatopics.csv
          type: csv
          source: outputs.topics_dir/reduced
          desc: Events mit zugeordneten MetaTopics
        - name: topic_map_old_to_meta.csv
          type: csv
          source: outputs.topics_dir/reduced
          desc: Mapping alter Topics auf MetaTopics
        - name: topic_info_meta.csv
          type: csv
          source: outputs.topics_dir/reduced
          desc: Informationen zu MetaTopics (Namen, Counts)
        - name: topic_info.csv
          type: csv
          source: outputs.topics_dir
          desc: Originale Topic-Infos
      use:
        - name: pandas
          type: library
        - name: pathlib.Path
          type: library
      output:
        - name: console_report
          type: text
          desc: Existenzprüfungen, Verteilungen, TopSubtopics, Beispieltexte

  - name: pipe/label_metatopics.py
    purpose: >
      Erzeugt automatische Labels für MetaTopics mithilfe c-TF-IDF.
      Erstellt Label-Listen, Zuordnungstabellen und erweiterte MetaTopic-Infos.
    io:
      input:
        - name: events_with_metatopics.csv
          type: csv
          source: outputs.topics_dir/reduced
          desc: Events mit MetaTopics
        - name: topic_info_meta.csv
          type: csv
          source: outputs.topics_dir/reduced
          desc: Basisinformationen der MetaTopics
      use:
        - name: pandas
          type: library
        - name: numpy
          type: library
        - name: re
          type: library
        - name: sklearn.feature_extraction.text.CountVectorizer
          type: library
        - name: sklearn.feature_extraction.text.TfidfTransformer
          type: library
      output:
        - name: meta_labels_auto.csv
          type: csv
          target: outputs.topics_dir/reduced
          desc: Alle automatisch extrahierten Labelkandidaten
        - name: meta_topic_label_map.csv
          type: csv
          target: outputs.topics_dir/reduced
          desc: Zuordnung MetaTopic → primäres Label
        - name: topic_info_meta_labeled.csv
          type: csv
          target: outputs.topics_dir/reduced
          desc: Erweiterte MetaTopic-Infos mit Labels
        - name: console_report
          type: text
          desc: Spaltenerkennung, Label-Vorschau

  - name: pipe/patch_events.py
    purpose: >
      Führt Events und Event-Actors zusammen, normalisiert E-Mail-Felder,
      vereinheitlicht Rollen und aggregiert Teilnehmerlisten.
    io:
      input:
        - name: events.csv
          type: csv
          source: paths.clean_dir
          desc: Rohdaten der Events
        - name: event_actor.csv
          type: csv
          source: paths.clean_dir
          desc: Rollen und Adressen der Akteure
      use:
        - name: pandas
          type: library
        - name: re
          type: library
        - name: json
          type: library
      output:
        - name: events_patched_with_participants.csv
          type: csv
          target: paths.clean_dir
          desc: Events mit aggregierten Teilnehmerdaten
        - name: console_report
          type: text
          desc: Preview (event_id, n_participants, text_len)

  - name: pipe/topics_flow/pipeline_master.py
    purpose: >
      Zentrale Steuerungspipeline. Führt nacheinander alle Hauptschritte der Topic- und Cluster-Flow-Verarbeitung aus.
    io:
      input: []
      use:
        - name: runpy
          type: library
          desc: Dynamischer Modulimport
      output:
        - name: topic_flows_filtered.csv
          type: csv
          target: reports.orgchart
          desc: Gefilterte Flussdaten
        - name: org_topics_hier.html
          type: html
          target: reports.orgchart/viz
          desc: Interaktive Visualisierung der Topic-Flüsse

  - name: pipe/topics_flow/prepare_topic_colors_and_edges.py
    purpose: >
      Erzeugt farbkodierte Topic-Kanten und Knotenlisten für Netzwerkvisualisierung.
      Erkennt automatisch alte und neue Flussschemata.
    io:
      input:
        - name: topic_flows_filtered.csv
          type: csv
          source: outputs.org_dir
          desc: Gefilterte Topic-Flussdaten
        - name: cluster_topic_pies_summary.csv
          type: csv
          source: outputs.org_dir
          desc: Clusterbezogene Topic-Verteilungen
      use:
        - name: pandas
          type: library
        - name: numpy
          type: library
        - name: matplotlib.colormaps
          type: library
      output:
        - name: edges_topics.csv
          type: csv
          target: outputs.org_dir/viz
        - name: nodes_topics.csv
          type: csv
          target: outputs.org_dir/viz
        - name: topic_colors.csv
          type: csv
          target: outputs.org_dir/viz
        - name: console_report
          type: text
          desc: Edges-, Nodes-, Topics-Zählung

  - name: pipe/reduce_topics.py
    purpose: >
      Reduziert BERTopic-Ergebnisse auf MetaTopics mithilfe Agglomerative Clustering
      auf Basis der Wortvektoren.
    io:
      input:
        - name: events_with_topics.csv
          type: csv
          source: outputs.topics_dir
        - name: topic_info.csv
          type: csv
          source: outputs.topics_dir
        - name: topic_words.csv
          type: csv
          source: outputs.topics_dir
      use:
        - name: pandas
          type: library
        - name: numpy
          type: library
        - name: sklearn.cluster.AgglomerativeClustering
          type: library
        - name: sklearn.metrics.pairwise.cosine_distances
          type: library
      output:
        - name: topic_map_old_to_meta.csv
          type: csv
          target: outputs.topics_dir/reduced
        - name: events_with_metatopics.csv
          type: csv
          target: outputs.topics_dir/reduced
        - name: topic_info_meta.csv
          type: csv
          target: outputs.topics_dir/reduced

  - name: pipe/render_pie_icons.py
    purpose: >
      Erzeugt runde PNG-Piechart-Icons für Cluster basierend auf Topic-Anteilen.
      Dient der visuellen Darstellung in Netzwerktools.
    io:
      input:
        - name: nodes_topics.csv
          type: csv
          source: outputs.org_dir/viz
        - name: topic_colors.csv
          type: csv
          source: outputs.org_dir/viz
      use:
        - name: matplotlib.pyplot
          type: library
        - name: pandas
          type: library
      output:
        - name: viz/pies/<cluster_id>.png
          type: image
          target: outputs.org_dir/viz/pies
          desc: Pie-Icons je Cluster

  - name: pipe/route_topics.py
    purpose: >
      Vereinheitlicht Events mit Topics oder MetaTopics und erzeugt
      standardisierte Event-Topic-Tabellen.
    io:
      input:
        - name: events_with_topics.csv
          type: csv
          source: outputs.topics_dir
        - name: topic_info.csv
          type: csv
          source: outputs.topics_dir
        - name: events_with_metatopics.csv
          type: csv
          source: outputs.topics_dir/reduced
          desc: Optional, wenn use_meta=True
        - name: meta_topic_label_map.csv
          type: csv
          source: outputs.topics_dir/reduced
          desc: Optional, für MetaTopic-Labels
      use:
        - name: pandas
          type: library
      output:
        - name: events_topics_active.csv
          type: csv
          target: outputs.topics_dir/reduced
        - name: console_report
          type: text
          desc: Vorschau aktiver Topics

  - name: pipe/select_hierarchy_levels.py
    purpose: >
      Wählt repräsentative Cluster pro Ebene aus Hierarchiedaten.
      Erstellt dynamische und Meta-Auswahldateien für Visualisierung.
    io:
      input:
        - name: infomap_levels.csv
          type: csv
          source: data_derived
        - name: cluster_stats_summary.csv
          type: csv
          source: reports.orgchart/cutoffs
          optional: true
      use:
        - name: pandas
          type: library
        - name: numpy
          type: library
      output:
        - name: selection_dynamic.json
          type: json
          target: reports.orgchart
        - name: selection_meta.json
          type: json
          target: reports.orgchart

  - name: selection_patch_flows.py
    purpose: >
      Ergänzt bestehende Cluster-Auswahl mit allen Clustern aus Topic-Flows
      und sorgt für Vollständigkeit der Hierarchie.
    io:
      input:
        - name: topic_flows_filtered.csv
          type: csv
          source: outputs.org_dir
        - name: infomap_levels.csv
          type: csv
          source: cfg.paths.levels
      use:
        - name: pandas
          type: library
        - name: matplotlib.cm
          type: library
        - name: yaml.safe_load
          type: library
      output:
        - name: selection_patched.json
          type: json
          desc: Erweiterte Auswahlhierarchie
        - name: extra_edges.json
          type: json
          desc: Liste der zusätzlichen Flow-Kantenobjekte

  - name: pipe/selection_to_nested.py
    purpose: >
      Wandelt flache Cluster-Auswahl (`selection_dynamic.json`) in
      verschachtelte Baumstruktur (`selection_nested.json`) um.
    io:
      input:
        - name: selection_dynamic.json
          type: json
          source: reports.orgchart
      use:
        - name: json
          type: library
      output:
        - name: selection_nested.json
          type: json
          target: reports.orgchart
          desc: Vollständige hierarchische Struktur

  - name: pipe/setup_env.py
    purpose: >
      Initialisiert das Projekt-Environment. Erkennt Umgebung (Colab/lokal),
      klont Repository, lädt YAML-Konfiguration und erstellt Pfadstruktur.
    io:
      input:
        - name: config/local.yaml
          type: yaml
          source: repo/config
      use:
        - name: os
          type: library
        - name: sys
          type: library
        - name: subprocess
          type: library
        - name: yaml
          type: library
      output:
        - name: env
          type: dict
          desc: Vollständige Umgebungskonfiguration (Pfade, Outputs)

  - name: pipe/topics_flow/topic_flows_between_clusters.py
    purpose: >
      Erzeugt Topic-Flüsse zwischen Clustern basierend auf Events,
      Event-Akteuren und Hierarchie-Leveln.
    io:
      input:
        - name: events.csv
          type: csv
          source: paths.clean_dir
        - name: event_actor.csv
          type: csv
          source: paths.clean_dir
        - name: infomap_levels.csv
          type: csv
          source: paths.levels_csv
        - name: events_with_thread_topics.csv
          type: csv
          source: outputs.org_dir
      use:
        - name: pandas
          type: library
      output:
        - name: topic_flows.csv
          type: csv
          target: outputs.org_dir
          desc: Aggregierte Topic-Flüsse zwischen Clustern

  - name: pipe/topics_flow/topic_flows.py
    purpose: >
      Erzeugt gerichtete Topic-Flüsse zwischen organisationalen Clustern
      auf Basis aggregierter Topic-Verteilungen und Label-Zuordnungen.
    io:
      input:
        - name: cluster_topic_pies_summary.csv
          type: csv
          source: outputs.org_dir
          desc: Aggregierte Topic-Verteilungen pro Cluster
        - name: topic_distribution_by_level.csv
          type: csv
          source: outputs.org_dir
          desc: Topic-Verteilungen nach Hierarchieebenen
        - name: events_with_topics.csv
          type: csv
          source: outputs.topics_dir
          optional: true
          desc: Optional, für Ereignisdaten mit Topics
        - name: infomap_levels.csv
          type: csv
          source: paths.levels_csv
          desc: Hierarchische Clusterstruktur
        - name: topic_info_labels.csv
          type: csv
          source: outputs.topics_dir
          desc: Label-Tabelle mit Topic-IDs und Namen
      use:
        - name: pandas
          type: library
        - name: numpy
          type: library
      output:
        - name: topic_flows_filtered.csv
          type: csv
          target: outputs.org_dir
          desc: Aggregierte, gefilterte Topic-Flüsse
        - name: topic_flows_filtered_<period>.csv
          type: csv
          target: outputs.org_dir
          optional: true
          desc: Periodische Varianten (z. B. nach Quartalen)
        - name: console_report
          type: text
          desc: Zusammenfassung von Flussstatistik und Warnungen

  - name: pipe/topics_flow/topics_flow.py
    purpose: >
      Führt BERTopic auf bereinigten Thread-Root-Mails aus und erzeugt
      standardisierte Topic-Ergebnisse (Events, Info, Words, Labels).
    io:
      input:
        - name: events_roots_for_topics.csv
          type: csv
          source: paths.clean_dir
          desc: Bereinigte Thread-Root-Mails mit Texten
      use:
        - name: BERTopic
          type: library
        - name: sentence_transformers.SentenceTransformer
          type: library
        - name: sklearn.feature_extraction.text.CountVectorizer
          type: library
        - name: sklearn.cluster.HDBSCAN
          type: library
        - name: umap.UMAP
          type: library
      output:
        - name: events_with_topics.csv
          type: csv
          target: outputs.topics_dir
          desc: Topic-Zuordnung je Event
        - name: topic_info.csv
          type: csv
          target: outputs.topics_dir
          desc: Übersicht der erkannten Topics
        - name: topic_words.csv
          type: csv
          target: outputs.topics_dir
          desc: Top-Wörter pro Topic
        - name: topic_info_labels.csv
          type: csv
          target: outputs.topics_dir
          desc: Kurzlabels für Topics
        - name: topic_probabilities.npy
          type: npy
          target: outputs.topics_dir
          optional: true
          desc: Wahrscheinlichkeiten pro Topic-Zuordnung
        - name: console_report
          type: text
          desc: Anzahl Topics, Noise-Cluster, Laufzeit

  - name: pipe/topics_flow/utils.py
    purpose: >
      Hilfsfunktionen für grafische Exporte.
      Erzeugt Pie-Chart-Bilder und Indexdateien pro Cluster.
    io:
      input:
        - name: pies
          type: dataframe
          desc: Cluster-Topic-Verteilungen mit Anteilen
      use:
        - name: matplotlib.pyplot
          type: library
        - name: pandas
          type: library
      output:
        - name: viz/pies/<cluster_id>.png
          type: image
          target: outputs.org_dir/viz/pies
        - name: cluster_pies_index.csv
          type: csv
          target: outputs.org_dir/viz/pies
          desc: Indexdatei mit Pfaden zu Pie-Bildern

  - name: pipe/vis_org_topics.py
    purpose: >
      Erzeugt interaktive HTML-Netzwerke, in denen Clusterknoten
      thematische Pie-Icons tragen und Topic-Kanten farbkodiert angezeigt werden.
    io:
      input:
        - name: nodes_topics.csv
          type: csv
          source: reports.orgchart/viz
          desc: Knotendaten mit Topic-Anteilen
        - name: edges_topics.csv
          type: csv
          source: reports.orgchart/viz
          desc: Kanten zwischen Clustern (Themenflüsse)
        - name: pies/
          type: directory
          source: reports.orgchart/viz/pies
          desc: PNG-Pie-Icons je Cluster
      use:
        - name: pyvis.network.Network
          type: library
        - name: pandas
          type: library
        - name: numpy
          type: library
      output:
        - name: org_topics_hier.html
          type: html
          target: reports.orgchart/viz
          desc: Interaktive hierarchische Netzwerkvisualisierung
        - name: console_report
          type: text
          desc: Anzahl Nodes, Edges, Filterstatistik
